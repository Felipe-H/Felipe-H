name: Generate Datas

on:
  schedule:
    # todo dia às 00h e 12h UTC. O valor anterior ("* /12 * *") tinha quatro
    # campos e um espaço no meio — cron inválido, o agendamento nunca registrou.
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - README.md

jobs:
  build:
    name: Jobs to update datas
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Snake Animation — a API mudou na v3: `svg_out_path` virou `outputs`,
      # que aceita uma lista e o parâmetro de paleta por arquivo.
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          # Paleta Flamengo: preto na base e vermelho forte no corpo da snake.
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23FF1A1A&color_dots=%23000000,%23250000,%23580000,%23A90000,%23FF1A1A
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23FF1A1A&color_dots=%23000000,%23250000,%23580000,%23A90000,%23FF1A1A

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update contribution count
        run: node scripts/update-contribution-count.mjs

      - name: Commit contribution count
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "Contribution count is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: atualiza contribuições no último ano [skip ci]"
          git push origin HEAD:main
