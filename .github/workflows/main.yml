name: Generate Datas

on:
  schedule:
    # todo dia às 00h e 12h UTC. O valor anterior ("* /12 * *") tinha quatro
    # campos e um espaço no meio — cron inválido, o agendamento nunca registrou.
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Jobs to update datas
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Snake Animation — a API mudou na v3: `svg_out_path` virou `outputs`,
      # que aceita uma lista e o parâmetro de paleta por arquivo.
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
